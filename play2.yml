---
- name: Create group and user
  hosts: all
  become: yes
  gather_facts: no

  vars:
    group_name: developers
    user_name: john

  tasks:
    - name: Create group
      group:
        name: "{{ group_name }}"
        state: present

    - name: Create user and add to group
      user:
        name: "{{ user_name }}"
        group: "{{ group_name }}"
        shell: /bin/bash
        create_home: yes
        state: present